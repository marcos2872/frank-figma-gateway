[package]
name = "frank-figma-gateway"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Local LLM gateway for the Figma desktop app"
rust-version = "1.77"

[lib]
name = "frank_figma_gateway_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
ffg-core = { path = "../crates/core" }
ffg-runtime = { path = "../crates/runtime" }
ffg-supervisor = { path = "../crates/supervisor" }
ffg-litellm = { path = "../crates/litellm" }
ffg-proxy = { path = "../crates/proxy" }
ffg-postgres = { path = "../crates/postgres" }
fs2 = "0.4"
hex = "0.4"
log = "0.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-autostart = "2"
tauri-plugin-log = "2"
tauri-plugin-notification = "2"
tauri-plugin-single-instance = "2"
thiserror = "2"
time = { version = "0.3", features = ["formatting"] }
uuid = { version = "1", features = ["v4"] }
tokio = { version = "1", features = ["process", "time"] }
tokio-util = { version = "0.7", features = ["rt"] }

[target.'cfg(windows)'.dependencies]
keyring = { version = "3", features = ["windows-native"] }
windows-sys = { version = "0.59", features = ["Win32_Foundation", "Win32_Security_Cryptography", "Win32_System_Memory", "Win32_System_Registry", "Win32_UI_WindowsAndMessaging"] }

[dev-dependencies]
tempfile = "3"
