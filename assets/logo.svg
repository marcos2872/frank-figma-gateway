<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512" role="img" aria-labelledby="t" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <title id="t">frank-figma-gateway</title>
  <style>
    .ink { fill: #1F2430; stroke: #1F2430; }
    .beam { stroke: #3DDC97; }
    @media (prefers-color-scheme: dark) {
      .ink { fill: #E8ECF4; stroke: #E8ECF4; }
    }
  </style>

  <!-- Haste vertical do F -->
  <rect class="ink" x="120" y="96" width="88" height="320" rx="24" stroke="none"/>

  <!-- Braço superior -->
  <rect class="ink" x="232" y="96" width="200" height="80" rx="24" stroke="none"/>

  <!-- Braço do meio: arco vazado (o portal), mais curto que o de cima -->
  <path class="ink" d="M252 340 V276 a50 50 0 0 1 100 0 V340" fill="none" stroke-width="44" stroke-linecap="butt"/>

  <!-- Feixe de dados atravessando o portal -->
  <line class="beam" x1="88" y1="304" x2="440" y2="304" stroke-width="26" stroke-linecap="round"/>
</svg>
