name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-runtime:
    name: build-runtime
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build LiteLLM runtime
        shell: pwsh
        run: ./scripts/build-litellm-runtime.ps1 -Version "1.108.1"

      - name: Build Postgres runtime
        shell: pwsh
        run: ./scripts/build-pgsql-runtime.ps1 -Version "16.9" -Build "1"

      - name: Generate manifest
        shell: pwsh
        run: |
          node scripts/manifest.mjs `
            --litellm "dist/litellm-runtime-1.108.1-win-x64.zip" `
            --pgsql "dist/pgsql-16.9-win-x64.zip" `
            --base-url "https://github.com/${{ github.repository }}/releases/download/${{ github.ref_name }}" `
            --out "dist/manifest.json" `
            --min-app-version "0.1.0"

      - uses: actions/upload-artifact@v4
        with:
          name: runtime-artifacts
          path: dist/
          if-no-files-found: error

  sign-manifest:
    name: sign-manifest
    needs: build-runtime
    runs-on: ubuntu-latest
    env:
      MANIFEST_SIGNING_KEY: ${{ secrets.MANIFEST_SIGNING_KEY }}
      MANIFEST_KEY_ID: ${{ vars.MANIFEST_KEY_ID }}
      MANIFEST_PUBLIC_KEY: ${{ vars.MANIFEST_PUBLIC_KEY }}
    steps:
      - uses: actions/checkout@v4

      - name: Verificar chave embutida no app
        run: node scripts/check-manifest-key.mjs

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src -> target

      - uses: actions/download-artifact@v4
        with:
          name: runtime-artifacts
          path: dist

      - name: Build manifest tools
        run: cargo build --manifest-path src/Cargo.toml --release -p manifest-signer -p manifest-verify

      - name: Sign manifest
        run: |
          set -euo pipefail
          if [ -z "${MANIFEST_SIGNING_KEY}" ]; then
            echo "MANIFEST_SIGNING_KEY não configurado" >&2
            exit 1
          fi
          if [ -z "${MANIFEST_KEY_ID}" ]; then
            echo "MANIFEST_KEY_ID não configurado" >&2
            exit 1
          fi
          printf '%s' "${MANIFEST_SIGNING_KEY}" > /tmp/manifest.key
          src/target/release/manifest-signer \
            --key /tmp/manifest.key \
            --key-id "${MANIFEST_KEY_ID}" \
            --input dist/manifest.json \
            --output dist/manifest.json.sig
          rm -f /tmp/manifest.key

      - name: Verify manifest
        run: |
          set -euo pipefail
          if [ -z "${MANIFEST_PUBLIC_KEY}" ]; then
            echo "MANIFEST_PUBLIC_KEY não configurado" >&2
            exit 1
          fi
          cat > /tmp/keys.json <<EOF
          [{
            "keyId": "${MANIFEST_KEY_ID}",
            "algorithm": "ed25519",
            "publicKey": "${MANIFEST_PUBLIC_KEY}",
            "status": "active"
          }]
          EOF
          src/target/release/manifest-verify \
            --manifest dist/manifest.json \
            --signature dist/manifest.json.sig \
            --keys /tmp/keys.json \
            --app-version "0.1.0" \
            --policy src/src-tauri/resources/runtime-policy.json

      - uses: actions/upload-artifact@v4
        with:
          name: signed-runtime-artifacts
          path: dist/
          if-no-files-found: error

  publish:
    name: publish
    needs: sign-manifest
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: signed-runtime-artifacts
          path: dist

      - name: Checksums
        run: |
          cd dist
          sha256sum * > SHA256SUMS
          cat SHA256SUMS

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${GITHUB_REF_NAME}" dist/* \
            --title "frank-figma-gateway ${GITHUB_REF_NAME}" \
            --notes "Runtime LiteLLM 1.108.1, Postgres 16.9 e manifesto assinado." \
            --verify-tag
